eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/} # Local: localhost. Docker/server: set EUREKA_URL=http://eureka:8761/eureka/
  instance:
    hostname: localhost # Avoid registering with machine hostname (e.g. ARUP.mshome.net) which DNS cannot resolve locally
    # Local: false (register as localhost). Docker/server: set EUREKA_PREFER_IP=true so other containers reach this one by container IP.
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    instance-id: localhost:gateway-service:8080


spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local: Keycloak on localhost:8181. Docker/server: set KEYCLOAK_JWK_URI=http://keycloak:8080/realms/fitness-app/protocol/openid-connect/certs
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8181/realms/fitness-app/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**

server:
  port: 8080