spring:

  mongodb:
    uri: ${MONGODB_URI}
    database: aiactivityfitness

  # we did this key-serializer and value-serializer cause we will send data as key-value pair to kafka
  # and kafka will store those data as key-value pair so key is String and value is JSON
  # activity {STRING}: <ACTIVITY> {OBJECT as JSON}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    name: activity-events

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # The URL where the Eureka Server is running
  instance:
    hostname: localhost # Avoid registering with machine hostname (e.g. ARUP.mshome.net) which DNS cannot resolve locally
    instance-id: localhost:activity-service:8082

server:
  port: 8082

